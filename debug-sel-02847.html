            <title>ClubCorp Web Tee Time Reservations</title>
            <script type="text/javascript" src="/portal/page/portal/jQuery/themes/default_v1.8.16/js/jquery-1.7.1.min.js"></script>
            <script type="text/javascript" src="/portal/page/portal/jQuery/themes/default_v1.8.16/js/jquery-ui-1.8.16.custom.min.js"></script>
            <script type="text/javascript" src="/portal/page/portal/jQuery/lib/plug-ins/jquery.countdown.package-1.5.8/jquery.countdown.pack.js"></script>
            <script type="text/javascript" src="/portal/page/portal/CCTTWEB/js/jquery.simplemodal-1.4.1.js"></script>
            <script type="text/javascript" src="/portal/page/portal/CCTTWEB/js/jquery.ba-postmessage.js"></script>
            <link rel="stylesheet" type="text/css" href="https://apps.invitedclubs.com/portal/page/portal/jQuery/lib/plug-ins/jquery.countdown.package-1.5.8/jquery.countdown.css?reload=1778422967307">
            <link rel="stylesheet" type="text/css" href="https://apps.invitedclubs.com/portal/page/portal/jQuery/themes/default_v1.8.16/css/custom-theme/jquery-ui-1.8.16.custom.css?reload=1778422967307">
            <link rel="stylesheet" type="text/css" href="https://apps.invitedclubs.com/portal/page/portal/CCTTWEB/css/ccttweb_common.css?reload=1778422967307">
            <script type="text/javascript" src="/portal/page/portal/CCXXWEB/js/fix_chrome_css.js"></script>
            
            <script type="text/javascript">
              var state_list = [];
              var state_entities = {};
              var village_entities = {};
              var has_network = "Y";
              var has_village = "Y";
              
              function build_network_state_options() {
                //console.log("In build_network_state_options");
                //console.log(JSON.stringify(state_list));
                
                for (let i = 0; i < state_list.length; i++) {
                  $("#cc-tt-network-state").append($("<option></option>").attr("value", state_list[i]).text(state_list[i]));
                }
              }
              
              function build_network_club_options(state_code) {
                $("#cc-tt-network-club").empty();
                
                //console.log(JSON.stringify(state_entities));
                
                // e.g. {"Turkey Creek Golf Club":"01535","Bernardo Heights Country Club":"02985"}
                var entities = state_entities[state_code];
                //console.log(JSON.stringify(entities));
                
                $("#cc-tt-network-club").append("<option>Select a Network Club</option>");
                for (var key in entities) {
                  $("#cc-tt-network-club").append($("<option></option>").attr("value", entities[key]).text(key));
                }
                $("#cc-tt-network-club").removeAttr("disabled");
              }
              
              function build_village_club_options() {
                for (var key in village_entities) {
                  $("#cc-tt-village-club").append($("<option></option>").attr("value", key).text(village_entities[key]));
                }
              }
              
              $(document).ready( function () {
                var network_action = "/portal/pls/portal/!ccttweb.controller?EVENT=HASH&ACT=GET_NETWORK";
                var village_action = "/portal/pls/portal/!ccttweb.controller?EVENT=HASH&ACT=GET_VILLAGE";
                
                $("#cc-tt-network-state").change(function() {
                  var state = $(this).val();
                  //console.log("Changed the state to: " + state);
                  
                  build_network_club_options(state);
                });
                
                $("#cc-tt-network-club").change(function() {
                  if ($(this).val()) {
                  
                    window.location.href="/portal/pls/portal/!CCTTWEB.controller?EVENT=HASH&ACT=VIEW&LOC=NTWK&ENTITY="
                      + $("#cc-tt-network-club").val();
                  }
                });
                
                $("#cc-tt-village-club").change(function() {
                  if ($(this).val()) {
                  
                    window.location.href="/portal/pls/portal/!CCTTWEB.controller?EVENT=HASH&ACT=VIEW&LOC=VILL&ENTITY="
                      + $("#cc-tt-village-club").val();
                  }
                });
                
                $("#home_club").click(function() {
                  window.location.href="/portal/pls/portal/!CCTTWEB.controller?EVENT=HASH&ACT=VIEW&LOC=CONT"
                });
                
                // TODO: This modal.close() call is not working
                $("#cc_close_hdr").on("click", function () { $.modal.close(); });
                
                if (has_network == "Y") {
                  $.ajax({
                    type: "GET",
                    url: network_action,
                    success: function(data) {
                      var result_json = {};
                      try {
                        eval(data);
                        
                        state_list = result_json.states;
                        state_entities = result_json.state_entities;
                        if (Object.keys(state_entities).length > 0) {
                          build_network_state_options();
                        }
                      } catch(err) {
                        console.log("Error loading network clubs: " + err.message);
                      }
                    }
                  });
                }
                
                if (has_village == "Y") {
                  $.ajax({
                    type: "GET",
                    url: village_action,
                    success: function(data) {
                      var result_json = {};
                      try {
                        eval(data);
                        
                        village_entities = result_json;
                        if (Object.keys(village_entities).length > 0) {
                          build_village_club_options();
                        }
                      } catch(err) {
                        console.log("Error loading village clubs: " + err.message);
                      }
                    }
                  });
                }
                
              });
            </script>
          
          </head>
<body leftmargin="0" rightmargin="0" topmargin="0" marginheight="0" marginwidth="0">
            <span id="simplemodal-placeholder" style="display: none;"></span>
            <div id="simplemodal-overlay" class="simplemodal-overlay" style="opacity: 0.5; height: 650px; width: 918px; position: fixed; left: 0px; top: 0px; z-index: 801;"></div>
            <div id="modalFormContainer" class="simplemodal-container" style="position: fixed; z-index: 802; height: 600px; width: 800px; left: 0px; top: 25px;">
              <div tabindex="-1" class="simplemodal-wrap" style="height: 100%; outline: 0px; width: 100%; overflow: visible;">
                <div id="cc_web_margin1" class="simplemodal-data" style="">
                  <div id="cc_web_margin2">
            
                    <div id="cc_web_header">
                      <div id="cc_close_hdr" class="cc-right" style="margin-right: 2px;height: 15px;"></div>
         
                      <div id="Tab-MyTeeTimes" class="cc-selected cc-tab-my-tee-times cc-selectable" onclick="" data-id="1"></div>
                    </div>
          
                    <div id="cc_web_messages"></div>
                    
                    <div style="text-align: center">
<div><p>Choose a Network Club</p></div>
              
                      <div>
                        <select id="cc-tt-network-state" name="network-state">
                          <option>Select State</option>
                        <option value="TX">TX</option><option value="FL">FL</option><option value="CA">CA</option><option value="MA">MA</option><option value="SC">SC</option><option value="PA">PA</option><option value="NV">NV</option><option value="JAL">JAL</option><option value="MI">MI</option><option value="VA">VA</option><option value="OH">OH</option><option value="AZ">AZ</option><option value="CO">CO</option><option value="NC">NC</option><option value="KS">KS</option><option value="GA">GA</option><option value="TN">TN</option><option value="NY">NY</option><option value="WA">WA</option><option value="OK">OK</option><option value="NJ">NJ</option><option value="IL">IL</option><option value="MD">MD</option><option value="MN">MN</option><option value="MO">MO</option></select>
                      </div>
              
                      <div style="padding-top:15px">
                        <select id="cc-tt-network-club" name="network-club" disabled="">
                        <option></option>
                        </select>
                      </div>
<div style="padding-top:15px">OR</div>
<div><p>Choose an Alternate Home Club</p></div>
                      
                      <div>
                        <select id="cc-tt-village-club" name="village-club">
                        <option>Select Alternate Home Club</option>
                        <option value="02820">Windermere Golf Club</option><option value="02845">Polo Golf &amp; Country Club</option><option value="03181">Brookstone Golf &amp; Country Club</option><option value="02832">Eagle Watch</option><option value="02812">The Clubs Of Peachtree City &amp; Newnan</option></select>
                      </div>
<div style="padding-top:15px">OR</div>
<div style="padding-top:15px">
                        <button id="home_club">Continue to Home Club</button>
                      </div>
                    </div>
            
                  </div>
                </div>
              </div>
            </div>
          
        
</body></html>
